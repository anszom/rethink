name: Publish GHCR Image

on:
    # Gated on CI's own conclusion (not a bare push trigger) so a build whose tests are
    # failing never gets published as :dev - see the CI workflow for what runs on push/PR.
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [master]
    release:
        types:
            - published

permissions:
    contents: read
    packages: write

concurrency:
    group: publish-ghcr-${{ github.event.workflow_run.head_branch || github.ref }}
    cancel-in-progress: true

jobs:
    publish:
        if: ${{ github.event_name == 'release' || github.event.workflow_run.conclusion == 'success' }}
        runs-on: ubuntu-latest
        # QEMU-emulated multi-arch builds have been observed hanging for hours (see run
        # 32424842349, cancelled after 6h) instead of failing outright - cap it so a stuck
        # build fails fast instead of quietly burning runner time.
        timeout-minutes: 30

        steps:
            - name: Checkout source
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.workflow_run.head_sha }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3
              with:
                  platforms: arm64,arm

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=raw,value=dev,enable=${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'master' }}
                      type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
                      type=raw,value=latest,enable=${{ github.event_name == 'release' && github.event.release.prerelease == false }}

            - name: Build and push image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile
                  platforms: linux/amd64,linux/arm64,linux/arm/v7
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
