<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Rethink monitor → panel</title>
        <link rel="icon" type="image/png" href="favicon.png" />
        <script>
            // Monitor is integrated into the main management UI.
            const q = window.location.search || ''
            window.location.replace('/' + q)
        </script>

    <body>
        <p>Monitor moved to the main panel. Redirecting… <a id="link" href="/">Open management</a></p>
        <script>
            document.getElementById('link').href = '/' + (window.location.search || '')
        </script>
    </body>
</html>
