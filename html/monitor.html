<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Rethink monitor → panel</title>
        <link rel="icon" type="image/png" href="favicon.png" />
        <script>
            // Monitor is integrated into the main management UI.
            // `./` keeps a reverse-proxy or Home Assistant ingress prefix; `/` would leave it.
            const dest = new URL('./', window.location.href)
            dest.search = window.location.search
            dest.hash = ''
            window.location.replace(dest.pathname + dest.search)
        </script>
    </head>
    <body>
        <p>Monitor moved to the main panel. Redirecting… <a id="link" href="./">Open management</a></p>
        <script>
            const dest = new URL('./', window.location.href)
            dest.search = window.location.search
            dest.hash = ''
            document.getElementById('link').href = dest.pathname + dest.search
        </script>
    </body>
</html>
